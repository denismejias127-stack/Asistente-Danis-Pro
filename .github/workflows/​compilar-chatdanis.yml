name: Generar APK de ChatDanis

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
    - name: Configurar trabajo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Limpiar Caché y Forzar Registro Oficial
      run: |
        npm config set registry https://registry.npmjs.org/
        rm -f package-lock.json
        npm cache clean --force
        npm install
        npm run build --if-present

    - name: Configurar entorno de Android (Java 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Inicializar Capacitor y Configurar Android
      run: |
        npm install -g @capacitor/cli
        npm install @capacitor/core @capacitor/android
        npx cap init "ChatDanis" "com.danis.chatdanis" --web-dir=dist/public
        npx cap add android
        npx cap sync

    - name: Inyectar Permisos Completos y Configuración de Red
      run: |
        # Inyectar permisos
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.CAMERA" \/>' android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>' android/app/src/main/AndroidManifest.xml
        
        # Configurar tráfico claro y hardware
        sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml
        echo "¡Permisos e inyección de hardware completados!"

    - name: Forzar Versión de Kotlin y Resolver Conflictos de Gradle
      run: |
        echo "subprojects {
            configurations.all {
                resolutionStrategy {
                    eachDependency { details ->
                        if (details.requested.group == 'org.jetbrains.kotlin') {
                            details.useVersion('1.8.22')
                        }
                    }
                }
            }
        }" >> android/build.gradle
        chmod +x android/gradlew

    - name: Crear APK
      run: |
        cd android && ./gradlew assembleDebug --info --stacktrace

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: apk-nueva-danis
        path: android/app/build/outputs/apk/debug/app-debug.apk

