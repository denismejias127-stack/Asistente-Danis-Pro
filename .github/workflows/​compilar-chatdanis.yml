name: Generar APK de ChatDanis

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Configurar trabajo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Instalar Dependencias y Compilar
      run: |
        npm install
        npm run build --if-present

    - name: Configurar entorno de Android (Java)
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Inicializar Capacitor y Crear APK
      run: |
        npm install -g @capacitor/cli
        npm install @capacitor/core @capacitor/android
        npx cap init "ChatDanis" "com.danis.chatdanis" --web-dir=dist/public
        npx cap add android
        npx cap sync
        cd android && ./gradlew assembleDebug

    - name: Subir APK como Artefacto
      uses: actions/upload-artifact@v4
      with:
        name: apk-nueva-danis
        path: android/app/build/outputs/apk/debug/app-debug.apk
