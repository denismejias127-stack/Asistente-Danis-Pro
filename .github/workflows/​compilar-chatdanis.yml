name: Generar APK de ChatDanis

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
    - name: Configurar trabajo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Compilar Web y Mover Archivos
      run: |
        npm install
        npm run build --if-present
        # Creamos la estructura de Android manualmente
        mkdir -p android/app/src/main/assets/public
        # Copiamos todo lo de la web a la carpeta de assets
        cp -r dist/public/* android/app/src/main/assets/public/

    - name: Configurar entorno de Android (Java 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Inyectar Permisos y WebView
      run: |
        # Inyectar permisos directamente en el Manifest
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

    - name: Crear APK (Forzado)
      run: |
        chmod +x android/gradlew
        cd android && ./gradlew assembleDebug

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-final-completa
        path: android/app/build/outputs/apk/debug/app-debug.apk
