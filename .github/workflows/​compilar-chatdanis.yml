name: ChatDanis

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
    - name: Configurar trabajo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Limpiar y Compilar
      run: |
        npm config set registry https://registry.npmjs.org/
        rm -f package-lock.json
        npm install
        npm run build --if-present

    - name: Configurar entorno de Android (Java 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Sincronizar Capacitor
      run: |
        npm install -g @capacitor/cli
        npm install @capacitor/core @capacitor/android
        # Eliminamos configuración vieja si existe para evitar conflictos
        rm -rf capacitor.config.json
        # Inicializamos sin --overwrite
        npx cap init "ChatDanis" "com.danis.chatdanis" --web-dir=dist/public
        npx cap add android
        npx cap sync

    - name: Inyectar Permisos y Configuración WebView
      run: |
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

    - name: Crear APK
      run: |
        chmod +x android/gradlew
        cd android && ./gradlew assembleDebug

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-nueva-danis
        path: android/app/build/outputs/apk/debug/app-debug.apk
