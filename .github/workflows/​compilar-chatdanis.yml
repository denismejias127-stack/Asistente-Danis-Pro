name: Generar APK de ChatDanis
on:
  push:
    branches: [ "*" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias y Compilar
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npm run build --if-present

      - name: Configurar Entorno de Android (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Inicializar Capacitor y Crear APK
        run: |
          npx cap init "ChatDanis" "com.danis.chatdanis" --web-dir=dist/public --if-present
          npx cap add android --if-present
          npx cap sync
          cd android
          ./gradlew assembleDebug

      - name: Subir APK Lista
        uses: actions/upload-artifact@v4
        with:
          name: chatdanis-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
