name: Generar APK de ChatDanis

on:
  workflow_dispatch:

jobs:
  construir:
    runs-on: ubuntu-latest

    steps:
    - name: Configurar trabajo
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Instalar, Compilar y Preparar Archivos
      run: |
        npm install
        npm run build --if-present
        # Aseguramos que la carpeta de salida exista
        mkdir -p dist/public

    - name: Configurar entorno de Android (Java 21)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Inicializar y Sincronizar Capacitor
      run: |
        npm install -g @capacitor/cli
        npm install @capacitor/core @capacitor/android
        # Forzamos la creación del proyecto Android sobre la base de tus archivos
        npx cap init "ChatDanis" "com.danis.chatdanis" --web-dir=dist/public --overwrite
        npx cap add android
        npx cap copy
        npx cap sync

    - name: Inyectar Permisos y Configuración WebView
      run: |
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" \/>' android/app/src/main/AndroidManifest.xml
        sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" \/>' android/app/src/main/AndroidManifest.xml
        sed -i 's/<application/<application android:hardwareAccelerated="true" android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml

    - name: Corregir permisos de Gradle y compilar
      run: |
        chmod +x android/gradlew
        cd android && ./gradlew assembleDebug

    - name: Subir APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-nueva-danis
        path: android/app/build/outputs/apk/debug/app-debug.apk
